<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Mario Rossi</title>

  <style>
    /* Reset */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: 'Inter', 'Segoe UI', sans-serif;
    background: linear-gradient(120deg, #e0eafc, #cfdef3);
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 20px;
}

/* Card stile moderno */
.detail-card {
    background: rgba(255, 255, 255, 0.85);
    backdrop-filter: blur(10px);
    padding: 35px 30px;
    border-radius: 12px;
    width: 100%;
    max-width: 420px;

    border: 1px solid rgba(255,255,255,0.4);
    box-shadow: 0 8px 30px rgba(0,0,0,0.08);

    transition: transform 0.25s ease;
}

.detail-card:hover {
    transform: translateY(-6px);
}

/* Titolo */
h1 {
    color: #2d3436;
    margin-bottom: 25px;
    font-size: 22px;
    letter-spacing: 0.5px;
}

/* Info */
.info-group {
    margin-bottom: 18px;
    padding: 12px 14px;
    border-radius: 8px;
    background: #f9fbfd;

    border-left: 4px solid #6c63ff;
}

.info-group strong {
    color: #6c63ff;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 1px;
}

.info-group p {
    font-size: 17px;
    color: #2f3640;
    margin-top: 4px;
}

/* Bottone */
.back-link {
    display: inline-block;
    margin-top: 25px;
    text-decoration: none;

    background: #6c63ff;
    color: white;
    padding: 8px 16px;
    border-radius: 20px;
    font-size: 0.85rem;

    transition: all 0.3s ease;
}

.back-link:hover {
    background: #4834d4;
    transform: scale(1.05);
}

  </style>  
</head>    
<body>

    <div class="detail-card">
        <h1>Profilo Utente</h1>
        
        <section>
            <div class="info-group">
                <strong>Nome Completo</strong>
                <p>Mario Rossi</p>
            </div>
            
            <div class="info-group">
                <strong>Indirizzo Email</strong>
                <p>mario@email.com</p>
            </div>
        </section>

        <a href="index.html" class="back-link">← Torna alla Directory</a>
    </div>

</body>
</html>
